{% extends 'base/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    /* Ocultar sidebar para el login del cliente */
    aside, #sidebar, .sidebar { display: none !important; }
    main { margin-left: 0 !important; width: 100% !important; }
</style>
{% endblock %}

{% block principal %}
<div class="min-h-screen flex items-center justify-center bg-[#060608] p-6 relative overflow-hidden">
    
    <div class="absolute top-1/4 -left-20 w-96 h-96 bg-primary/20 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-neon-purple/20 rounded-full blur-[120px]"></div>

    <div class="relative z-10 w-full max-w-md bg-white/5 border border-white/10 p-10 rounded-[2.5rem] backdrop-blur-xl shadow-2xl">
        
        <div class="text-center mb-10">
            <div class="inline-flex p-4 rounded-3xl bg-primary/20 text-primary mb-6 shadow-lg shadow-primary/20">
                <span class="material-symbols-outlined text-4xl">person</span>
            </div>
            <h2 class="text-4xl font-black text-white tracking-tighter">Portal de Cliente</h2>
            <p class="text-slate-400 mt-2 font-medium">Consulta tus cuotas y estados de cuenta</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label class="block text-sm font-bold text-slate-300 ml-1 uppercase tracking-widest">Cédula de Identidad</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">fingerprint</span>
                    <input type="text" name="username" required 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl pl-12 pr-4 py-4 text-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-slate-600"
                        placeholder="Ingrese su número de cédula">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-bold text-slate-300 ml-1 uppercase tracking-widest">PIN de Seguridad</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">lock</span>
                    <input type="password" name="password" required 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl pl-12 pr-4 py-4 text-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-slate-600"
                        placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" 
                class="w-full bg-primary hover:bg-primary/80 text-white font-black py-5 rounded-2xl transition-all shadow-xl shadow-primary/20 hover:scale-[1.02] active:scale-95 text-lg">
                ACCEDER A MI CUENTA
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="{% url 'landing' %}" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-white transition-colors font-bold uppercase tracking-widest">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
